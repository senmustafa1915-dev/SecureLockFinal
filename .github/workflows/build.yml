package com.securelock.guard

import android.content.BroadcastReceiver
import android.content.Context
import android.content.Intent

class BootReceiver : BroadcastReceiver() {

    override fun onReceive(
        context: Context,
        intent: Intent?
    ) {
        if (intent?.action != Intent.ACTION_BOOT_COMPLETED) return

        // Katı Mod ve planlı kilit zamanları yerel kayıtlarda tutulur.
        // Erişilebilirlik hizmeti etkin olduğunda uygulama geçişlerini
        // yeniden denetlemeye devam eder.

        LockStore.prefs(context)
    }
}


