package com.securelock.guard

import android.app.Activity
import android.app.AlertDialog
import android.app.TimePickerDialog
import android.app.admin.DevicePolicyManager
import android.content.ComponentName
import android.content.Context
import android.content.Intent
import android.graphics.Color
import android.graphics.Typeface
import android.graphics.drawable.Drawable
import android.os.Bundle
import android.provider.Settings
import android.view.Gravity
import android.view.View
import android.view.ViewGroup
import android.view.inputmethod.InputType
import android.widget.EditText
import android.widget.FrameLayout
import android.widget.ImageView
import android.widget.LinearLayout
import android.widget.ScrollView
import android.widget.Switch
import android.widget.TextView
import android.widget.Toast
import android.accessibilityservice.AccessibilityServiceInfo
import android.view.accessibility.AccessibilityManager
import java.util.Calendar
import java.util.Locale

class MainActivity : Activity() {

    private data class AppItem(
        val name: String,
        val packageName: String,
        val icon: Drawable
    )

    private lateinit var root: FrameLayout
    private lateinit var content: LinearLayout
    private lateinit var drawer: LinearLayout
    private lateinit var scrim: View

    private var page = "apps"
    private var searchQuery = ""

    private val backgroundColor = Color.rgb(10, 10, 10)
    private val panelColor = Color.rgb(25, 25, 25)
    private val textColor = Color.WHITE
    private val mutedColor = Color.LTGRAY
    private val accentColor = Color.rgb(80, 170, 255)

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        window.statusBarColor = backgroundColor
        window.navigationBarColor = backgroundColor
        window.decorView.setBackgroundColor(backgroundColor)

        createShell()
        renderPage()

        if (
            LockStore.prefs(this)
                .getString("admin_hash", null)
                .isNullOrBlank()
        ) {
            firstRunSetup()
        }
    }

    override fun onResume() {
        super.onResume()
        if (::content.isInitialized) renderPage()
    }

    private fun dp(value: Int): Int =
        (value * resources.displayMetrics.density).toInt()

    private fun createShell() {
        root = FrameLayout(this)

        content = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setBackgroundColor(backgroundColor)
        }

        val toolbar = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            gravity = Gravity.CENTER_VERTICAL
            setPadding(dp(12), dp(8), dp(12), dp(8))
            setBackgroundColor(panelColor)
        }

        val menuButton = textButton("☰", 25)
        menuButton.setOnClickListener { openDrawer() }

        val title = TextView(this).apply {
            text = "SECURE LOCK"
            textSize = 18f
            setTextColor(textColor)
            setTypeface(null, Typeface.BOLD)
            gravity = Gravity.CENTER_VERTICAL
            setPadding(dp(16), 0, 0, 0)
        }

        toolbar.addView(
            menuButton,
            LinearLayout.LayoutParams(dp(48), dp(48))
        )

        toolbar.addView(
            title,
            LinearLayout.LayoutParams(0, dp(48), 1f)
        )

        content.addView(toolbar)

        scrim = View(this).apply {
            setBackgroundColor(0x99000000.toInt())
            visibility = View.GONE
            setOnClickListener { closeDrawer() }
        }

        drawer = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(dp(16), dp(32), dp(16), dp(16))
            setBackgroundColor(Color.rgb(22, 22, 22))
            translationX = -dp(290).toFloat()
        }

        root.addView(
            content,
            FrameLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.MATCH_PARENT
            )
        )

        root.addView(
            scrim,
            FrameLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.MATCH_PARENT
            )
        )

        root.addView(
            drawer,
            FrameLayout.LayoutParams(
                dp(290),
                ViewGroup.LayoutParams.MATCH_PARENT,
                Gravity.START
            )
        )

        buildDrawer()
        setContentView(root)
    }

    private fun buildDrawer() {
        drawer.removeAllViews()

        val heading = TextView(this).apply {
            text = "SECURE LOCK"
            textSize = 21f
            setTextColor(textColor)
            setTypeface(null, Typeface.BOLD)
            setPadding(0, 0, 0, dp(24))
        }

        drawer.addView(heading)

        drawerItem("Uygulamalar") {
            page = "apps"
            searchQuery = ""
            renderPage()
            closeDrawer()
        }

        drawerItem("Aktif Kilitler") {
            page = "active"
            renderPage()
            closeDrawer()
        }

        drawerItem("Ayarlar ve Güvenlik") {
            page = "settings"
            renderPage()
            closeDrawer()
        }
    }

    private fun drawerItem(
        label: String,
        action: () -> Unit
    ) {
        val item = textButton(label, 16)

        item.gravity = Gravity.CENTER_VERTICAL
        item.setPadding(dp(12), dp(14), dp(12), dp(14))
        item.setOnClickListener { action() }

        drawer.addView(
            item,
            LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.WRAP_CONTENT
            )
        )
    }

    private fun openDrawer() {
        scrim.visibility = View.VISIBLE
        drawer.animate()
            .translationX(0f)
            .setDuration(180)
            .start()
    }

    private fun closeDrawer() {
        drawer.animate()
            .translationX(-dp(290).toFloat())
            .setDuration(180)
            .withEndAction {
                scrim.visibility = View.GONE
            }
            .start()
    }

    private fun renderPage() {
        if (content.childCount > 1) {
            content.removeViewAt(1)
        }

        val body = when (page) {
            "active" -> activeLocksPage()
            "settings" -> settingsPage()
            else -> appsPage()
        }

        content.addView(
            body,
            LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                0,
                1f
            )
        )
    }

    private fun appsPage(): View {
        val scroll = ScrollView(this)

        val column = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(dp(14), dp(12), dp(14), dp(24))
        }

        val search = EditText(this).apply {
            hint = "Uygulama ara..."
            setSingleLine(true)
            setTextColor(textColor)
            setHintTextColor(mutedColor)
            setPadding(dp(14), dp(12), dp(14), dp(12))
            setBackgroundColor(panelColor)
            setText(searchQuery)

            addTextChangedListener(object : android.text.TextWatcher {
                override fun beforeTextChanged(
                    s: CharSequence?,
                    start: Int,
                    count: Int,
                    after: Int
                ) {}

                override fun onTextChanged(
                    s: CharSequence?,
                    start: Int,
                    before: Int,
                    count: Int
                ) {
                    searchQuery = s?.toString().orEmpty()
                    rebuildAppRows(column)
                }

                override fun afterTextChanged(s: android.text.Editable?) {}
            })
        }

        column.addView(
            search,
            LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                dp(52)
            )
        )

        val rows = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
        }

        column.addView(rows)
        rebuildAppRows(column)

        scroll.addView(column)
        return scroll
    }

    private fun rebuildAppRows(container: LinearLayout) {
        if (container.childCount < 2) return

        val rows = container.getChildAt(1) as LinearLayout
        rows.removeAllViews()

        val apps = loadApps().filter {
            it.name.contains(searchQuery, true) ||
            it.packageName.contains(searchQuery, true)
        }

        val locked = apps.filter {
            LockStore.isLockedNow(this, it.packageName)
        }

        val others = apps.filterNot {
            LockStore.isLockedNow(this, it.packageName)
        }

        addSection(rows, "KİLİTLİ UYGULAMALAR (${locked.size})")
        locked.forEach { rows.addView(appRow(it)) }

        addSection(rows, "DİĞER UYGULAMALAR (${others.size})")
        others.forEach { rows.addView(appRow(it)) }
    }

    private fun loadApps(): List<AppItem> {
        val result = mutableListOf<AppItem>()

        val installed = try {
            @Suppress("DEPRECATION")
            packageManager.getInstalledApplications(0)
        } catch (_: Exception) {
            emptyList()
        }

        for (info in installed) {
            if (info.packageName == packageName) continue

            try {
                val label = info.loadLabel(packageManager).toString()
                val icon = info.loadIcon(packageManager)

                result.add(
                    AppItem(
                        label,
                        info.packageName,
                        icon
                    )
                )
            } catch (_: Exception) {
                // Erişilemeyen paketler listelenmez.
            }
        }

        return result.sortedBy {
            it.name.lowercase(Locale.getDefault())
        }
    }

    private fun appRow(app: AppItem): View {
        val row = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            gravity = Gravity.CENTER_VERTICAL
            setPadding(dp(8), dp(8), dp(8), dp(8))
            setBackgroundColor(backgroundColor)
        }

        val icon = ImageView(this).apply {
            setImageDrawable(app.icon)
            scaleType = ImageView.ScaleType.FIT_CENTER
        }

        row.addView(
            icon,
            LinearLayout.LayoutParams(dp(44), dp(44))
        )

        val info = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(dp(12), 0, dp(4), 0)
        }

        val title = TextView(this).apply {
            text = app.name
            textSize = 15f
            setTextColor(textColor)
        }

        val subtitle = TextView(this).apply {
            text = app.packageName
            textSize = 10f
            setTextColor(mutedColor)
        }

        info.addView(title)
        info.addView(subtitle)

        row.addView(
            info,
            LinearLayout.LayoutParams(0, -2, 1f)
        )

        val isLocked =
            LockStore.isLockedNow(this, app.packageName)

        val toggle = Switch(this).apply {
            isChecked = isLocked

            setOnCheckedChangeListener { _, checked ->
                if (
                    LockStore.isStrictActive(
                        this@MainActivity,
                        app.packageName
                    )
                ) {
                    Toast.makeText(
                        this@MainActivity,
                        "Katı Mod süresi dolmadan kaldırılamaz.",
                        Toast.LENGTH_SHORT
                    ).show()

                    isChecked = true
                } else {
                    LockStore.setMode(
                        this@MainActivity,
                        app.packageName,
                        if (checked) "NORMAL" else ""
                    )

                    renderPage()
                }
            }
        }

        row.addView(toggle)

        row.setOnClickListener {
            showModeDialog(app)
        }

        row.setOnLongClickListener {
            showModeDialog(app)
            true
        }

        return row
    }

    private fun addSection(
        parent: LinearLayout,
        title: String
    ) {
        val label = TextView(this).apply {
            text = title
            textSize = 12f
            setTextColor(accentColor)
            setTypeface(null, Typeface.BOLD)
            setPadding(dp(4), dp(18), dp(4), dp(8))
        }

        parent.addView(label)
    }

    private fun showModeDialog(app: AppItem) {
        if (LockStore.isStrictActive(this, app.packageName)) {
            val remaining =
                LockStore.strictUntil(this, app.packageName) -
                System.currentTimeMillis()

            AlertDialog.Builder(this)
                .setTitle("Katı Mod etkin")
                .setMessage(
                    "Bu kilit süre dolana kadar hiçbir şifreyle kaldırılamaz.\n\n" +
                    "Kalan süre: ${formatDuration(remaining)}"
                )
                .setPositiveButton("Tamam", null)
                .show()

            return
        }

        val options = arrayOf(
            "Normal Kilit",
            "Sıkı Mod – VIP özel şifre",
            "Katı Mod – Zaman kilidi",
            "Planlı Kilit",
            "Kilidi Kaldır"
        )

        AlertDialog.Builder(this)
            .setTitle(app.name)
            .setItems(options) { _, which ->
                when (which) {
                    0 -> {
                        LockStore.setMode(
                            this,
                            app.packageName,
                            "NORMAL"
                        )
                        renderPage()
                    }

                    1 -> configureVip(app)
                    2 -> configureStrict(app)
                    3 -> configureSchedule(app)

                    4 -> {
                        LockStore.setMode(
                            this,
                            app.packageName,
                            ""
                        )

                        LockStore.prefs(this).edit()
                            .remove("schedule_start:${app.packageName}")
                            .remove("schedule_end:${app.packageName}")
                            .apply()

                        renderPage()
                    }
                }
            }
            .show()
    }

    private fun configureVip(app: AppItem) {
        promptPassword("VIP uygulama şifresi belirle") { first ->
            promptPassword("VIP şifresini tekrar gir") { second ->

                if (first != second) {
                    toast("Şifreler eşleşmiyor.")
                    return@promptPassword
                }

                LockStore.saveSecret(
                    this,
                    "vip:${app.packageName}",
                    first
                )

                LockStore.setMode(
                    this,
                    app.packageName,
                    "VIP"
                )

                toast("VIP kilidi etkinleştirildi.")
                renderPage()
            }
        }
    }

    private fun configureStrict(app: AppItem) {
        val labels = arrayOf(
            "1 saat",
            "6 saat",
            "12 saat",
            "24 saat",
            "48 saat",
            "72 saat",
            "7 gün"
        )

        val durations = longArrayOf(
            1, 6, 12, 24, 48, 72, 168
        )

        AlertDialog.Builder(this)
            .setTitle("Katı Mod süresi")
            .setItems(labels) { _, index ->

                val until =
                    System.currentTimeMillis() +
                    durations[index] * 60L * 60L * 1000L

                LockStore.setStrictUntil(
                    this,
                    app.packageName,
                    until
                )

                toast("Katı Mod başlatıldı.")
                renderPage()
            }
            .show()
    }

    private fun configureSchedule(app: AppItem) {
        val now = Calendar.getInstance()

        TimePickerDialog(
            this,
            { _, startHour, startMinute ->

                val start = startHour * 60 + startMinute

                TimePickerDialog(
                    this,
                    { _, endHour, endMinute ->

                        val end = endHour * 60 + endMinute

                        LockStore.prefs(this).edit()
                            .putInt(
                                "schedule_start:${app.packageName}",
                                start
                            )
                            .putInt(
                                "schedule_end:${app.packageName}",
                                end
                            )
                            .apply()

                        LockStore.setMode(
                            this,
                            app.packageName,
                            "SCHEDULE"
                        )

                        toast("Planlı kilit kaydedildi.")
                        renderPage()
                    },
                    now.get(Calendar.HOUR_OF_DAY),
                    now.get(Calendar.MINUTE),
                    true
                ).apply {
                    setTitle("Bitiş saati")
                    show()
                }
            },
            now.get(Calendar.HOUR_OF_DAY),
            now.get(Calendar.MINUTE),
            true
        ).apply {
            setTitle("Başlangıç saati")
            show()
        }
    }

    private fun activeLocksPage(): View {
        val scroll = ScrollView(this)

        val column = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(dp(16), dp(16), dp(16), dp(24))
        }

        addSection(column, "AKTİF KATI MOD KİLİTLERİ")

        val now = System.currentTimeMillis()

        val active = loadApps().filter {
            LockStore.strictUntil(this, it.packageName) > now
        }

        if (active.isEmpty()) {
            addInfo(column, "Şu anda aktif Katı Mod kilidi yok.")
        } else {
            active.forEach { app ->
                val remaining =
                    LockStore.strictUntil(this, app.packageName) - now

                addInfo(
                    column,
                    "${app.name}\nKalan süre: ${formatDuration(remaining)}"
                )
            }
        }

        scroll.addView(column)
        return scroll
    }

    private fun settingsPage(): View {
        val scroll = ScrollView(this)

        val column = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(dp(16), dp(16), dp(16), dp(24))
        }

        addSection(column, "AYARLAR VE GÜVENLİK")

        addInfo(
            column,
            "Erişilebilirlik hizmeti: " +
            if (isAccessibilityEnabled()) "Etkin" else "Etkin değil"
        )

        addButton(column, "Erişilebilirlik iznini aç") {
            startActivity(
                Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
            )
        }

        val dpm =
            getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager

        val admin = ComponentName(
            this,
            SecureLockAdminReceiver::class.java
        )

        addInfo(
            column,
            "Cihaz yöneticisi: " +
            if (dpm.isAdminActive(admin)) "Etkin" else "Etkin değil"
        )

        addButton(column, "Cihaz yöneticisi iznini etkinleştir") {
            val intent =
                Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN).apply {
                    putExtra(
                        DevicePolicyManager.EXTRA_DEVICE_ADMIN,
                        admin
                    )

                    putExtra(
                        DevicePolicyManager.EXTRA_ADD_EXPLANATION,
                        "Secure Lock cihaz güvenliği işlevleri için bu izni kullanır."
                    )
                }

            startActivity(intent)
        }

        addInfo(
            column,
            "Cihaz Sahibi yetkisi: " +
            if (dpm.isDeviceOwnerApp(packageName)) "Etkin" else "Etkin değil"
        )

        addButton(
            column,
            "Uygulama kaldırma korumasını etkinleştir"
        ) {
            if (dpm.isDeviceOwnerApp(packageName)) {
                try {
                    dpm.setUninstallBlocked(
                        admin,
                        packageName,
                        true
                    )

                    toast("Kaldırma engeli etkinleştirildi.")
                } catch (e: Exception) {
                    toast("İşlem başarısız: ${e.message}")
                }
            } else {
                toast("Bu işlem için Cihaz Sahibi yetkisi gerekir.")
            }
        }

        addButton(column, "Yönetici şifresini değiştir") {
            changePassword("admin")
        }

        addButton(column, "Normal kilit şifresini değiştir") {
            changePassword("normal")
        }

        addInfo(
            column,
            "Cihaz Sahibi yetkisi olmadan uygulamanın kaldırılmasını veya sistem ayarlarının değiştirilmesini tamamen engellemek mümkün değildir."
        )

        scroll.addView(column)
        return scroll
    }

    private fun isAccessibilityEnabled(): Boolean {
        val manager =
            getSystemService(ACCESSIBILITY_SERVICE) as AccessibilityManager

        return manager
            .getEnabledAccessibilityServiceList(
                AccessibilityServiceInfo.FEEDBACK_ALL_MASK
            )
            .any {
                it.resolveInfo.serviceInfo.packageName == packageName &&
                it.resolveInfo.serviceInfo.name.endsWith(
                    "LockAccessibilityService"
                )
            }
    }

    private fun changePassword(key: String) {
        promptPassword("Mevcut şifreyi gir") { old ->

            if (!LockStore.verifySecret(this, key, old)) {
                toast("Mevcut şifre yanlış.")
                return@promptPassword
            }

            promptPassword("Yeni şifre (en az 6 karakter)") { new ->

                promptPassword("Yeni şifreyi tekrar gir") { repeat ->

                    if (new != repeat) {
                        toast("Şifreler eşleşmiyor.")
                    } else {
                        LockStore.saveSecret(this, key, new)
                        toast("Şifre değiştirildi.")
                    }
                }
            }
        }
    }

    private fun firstRunSetup() {
        AlertDialog.Builder(this)
            .setTitle("Secure Lock kurulumu")
            .setMessage(
                "Önce yönetici şifresini, ardından normal uygulama kilidi şifresini belirle. Şifrelerini unutma; kurtarma yöntemi bulunmuyor."
            )
            .setCancelable(false)
            .setPositiveButton("Başla") { _, _ ->

                promptPassword("Yönetici şifresi oluştur") { admin ->

                    LockStore.saveSecret(this, "admin", admin)

                    promptPassword("Normal kilit şifresi oluştur") { normal ->

                        LockStore.saveSecret(this, "normal", normal)
                        toast("İlk kurulum tamamlandı.")
                    }
                }
            }
            .show()
    }

    private fun promptPassword(
        title: String,
        callback: (String) -> Unit
    ) {
        val input = EditText(this).apply {
            inputType =
                InputType.TYPE_CLASS_TEXT or
                InputType.TYPE_TEXT_VARIATION_PASSWORD

            hint = "En az 6 karakter"
            setSingleLine(true)
        }

        val box = LinearLayout(this).apply {
            setPadding(dp(24), dp(8), dp(24), dp(4))
            addView(input)
        }

        val dialog = AlertDialog.Builder(this)
            .setTitle(title)
            .setView(box)
            .setNegativeButton("İptal", null)
            .setPositiveButton("Onayla", null)
            .create()

        dialog.setOnShowListener {
            dialog.getButton(AlertDialog.BUTTON_POSITIVE)
                .setOnClickListener {

                    val value = input.text.toString()

                    if (value.length < 6) {
                        input.error = "En az 6 karakter gerekli."
                    } else {
                        dialog.dismiss()
                        callback(value)
                    }
                }
        }

        dialog.show()
    }

    private fun addButton(
        parent: LinearLayout,
        label: String,
        action: () -> Unit
    ) {
        val button = textButton(label, 14).apply {
            gravity = Gravity.CENTER
            setPadding(dp(12), dp(14), dp(12), dp(14))
            setBackgroundColor(panelColor)
            setOnClickListener { action() }
        }

        val params = LinearLayout.LayoutParams(
            ViewGroup.LayoutParams.MATCH_PARENT,
            ViewGroup.LayoutParams.WRAP_CONTENT
        )

        params.bottomMargin = dp(8)
        parent.addView(button, params)
    }

    private fun addInfo(
        parent: LinearLayout,
        value: String
    ) {
        val view = TextView(this).apply {
            text = value
            textSize = 14f
            setTextColor(mutedColor)
            setPadding(dp(4), dp(12), dp(4), dp(12))
        }

        parent.addView(view)
    }

    private fun textButton(
        label: String,
        size: Int
    ): TextView =
        TextView(this).apply {
            text = label
            textSize = size.toFloat()
            setTextColor(textColor)
            gravity = Gravity.CENTER
            isClickable = true
            isFocusable = true
        }

    private fun formatDuration(milliseconds: Long): String {
        val totalSeconds =
            milliseconds.coerceAtLeast(0L) / 1000L

        val days = totalSeconds / 86400
        val hours = (totalSeconds % 86400) / 3600
        val minutes = (totalSeconds % 3600) / 60
        val seconds = totalSeconds % 60

        return if (days > 0) {
            "${days}g ${hours}s ${minutes}d"
        } else {
            String.format(
                Locale.getDefault(),
                "%02d:%02d:%02d",
                hours,
                minutes,
                seconds
            )
        }
    }

    private fun toast(message: String) {
        Toast.makeText(
            this,
            message,
            Toast.LENGTH_SHORT
        ).show()
    }
}


